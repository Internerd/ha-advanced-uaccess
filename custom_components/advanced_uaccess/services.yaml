add_receiver:
  fields:
    entity_id:
      selector:
        entity:
          integration: advanced_uaccess
          domain: switch
    caller_id:
      example: "28704e31e640"
      selector:
        text:
    room_id:
      example: "566126a3-2809-4993-9625-b1bfb6ebd6e0"
      selector:
        text:
    receiver_type:
      selector:
        select:
          translation_key: receiver_type
          options:
            - viewer
            - admin
            - chime
            - phone_number
            - third_party_sip
            - third_party_viewer
    receiver_id:
      example: "E43883358449"
      selector:
        text:

