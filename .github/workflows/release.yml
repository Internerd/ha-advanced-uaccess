name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Check version and attach zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(jq -r .version custom_components/advanced_uaccess/manifest.json)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - name: Build zip
        run: cd custom_components/advanced_uaccess && zip -r ../../advanced_uaccess.zip . -x "__pycache__/*"
      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" advanced_uaccess.zip --clobber
