name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove names, phone numbers and e-mail addresses from everything you paste.
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: access
    attributes:
      label: UniFi Access version and console model
      placeholder: "Access 3.14.4556 on UNVR"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: "Enable `custom_components.advanced_uaccess: debug` and paste the relevant lines."
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Attach the diagnostics download of the integration (it is redacted).
